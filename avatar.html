<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alice</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #f2f0fa;
               font-family: "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  body.quieto { cursor: none; }
  video { position: fixed; inset: 0; width: 100%; height: 100%;
          object-fit: contain; background: #000; }
  #panel { position: fixed; inset: 0; display: grid; place-content: center;
           justify-items: center; gap: 18px; padding: 24px; text-align: center;
           background: #1f1b3d; }
  #panel[hidden] { display: none; }
  #mensaje { max-width: 46ch; font-size: 1.15rem; line-height: 1.5; margin: 0; }
  .fila { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .fila[hidden] { display: none; }
  select, button { font: inherit; padding: 9px 14px; border-radius: 8px;
                   border: 1px solid #6a63a8; background: #2b2458; color: inherit; }
  button.principal { background: #f0503c; border-color: #f0503c; color: #fff; font-weight: 600; }
  button:focus-visible, select:focus-visible { outline: 3px solid #b9b2f0; outline-offset: 2px; }
  #ayuda { font-size: .9rem; color: #b9b2f0; margin: 0; }
</style>
</head>
<body>
<video id="video" autoplay muted playsinline></video>

<div id="panel">
  <p id="mensaje">Buscando la cámara virtual de Animaze…</p>
  <div class="fila" id="controles" hidden>
    <select id="camaras" aria-label="Cámara"></select>
    <button id="mostrar" class="principal" type="button">Mostrar</button>
    <button id="buscar" type="button">Buscar de nuevo</button>
  </div>
  <p id="ayuda">Doble clic o tecla F para pantalla completa.</p>
</div>

<script>
const video = document.getElementById("video");
const panel = document.getElementById("panel");
const mensaje = document.getElementById("mensaje");
const controles = document.getElementById("controles");
const lista = document.getElementById("camaras");
let flujo = null;

function avisar(texto, conControles = true) {
  mensaje.textContent = texto;
  controles.hidden = !conControles;
  panel.hidden = false;
}

// Pone un flujo de video en pantalla. Cierra el anterior DESPUÉS de tener el nuevo,
// porque si el navegador se queda sin cámaras abiertas puede quitar el permiso.
async function usarFlujo(nuevo, nombre) {
  const anterior = flujo;
  flujo = nuevo;
  flujo.getVideoTracks()[0].onended = () =>
    avisar("Se cortó la cámara. Vuelve a pulsar «Habilitar cámara virtual» en Animaze y luego «Buscar de nuevo».");
  video.srcObject = flujo;
  if (anterior) anterior.getTracks().forEach(t => t.stop());
  panel.hidden = true;
  try { localStorage.setItem("camaraAlice", nombre || ""); } catch (e) {}
  try { await video.play(); } catch (e) {}
}

async function abrir(deviceId, nombre) {
  const nuevo = await navigator.mediaDevices.getUserMedia({
    video: { deviceId: { exact: deviceId }, width: { ideal: 1920 }, height: { ideal: 1080 } },
    audio: false
  });
  await usarFlujo(nuevo, nombre);
}

async function iniciar() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    avisar("Este navegador no deja abrir la cámara desde esta página. Ábrela con Chrome o Edge.", false);
    return;
  }
  avisar("Buscando la cámara virtual de Animaze…", false);

  let prueba;
  try {
    prueba = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
  } catch (e) {
    const causas = {
      NotAllowedError: "El navegador no dio permiso para usar la cámara. Pulsa el icono de cámara en la barra de direcciones, permite el acceso y recarga la página.",
      NotFoundError: "No hay ninguna cámara disponible. En Animaze pulsa «Habilitar cámara virtual» y recarga la página.",
      NotReadableError: "Otra aplicación está usando la cámara. Ciérrala y pulsa «Buscar de nuevo»."
    };
    avisar(causas[e.name] || "No se pudo abrir la cámara (" + e.name + ").");
    return;
  }

  try {
    const pista = prueba.getVideoTracks()[0];

    // Si el navegador ya abrió la cámara de Animaze (la que elegiste al dar permiso), se usa tal cual.
    if (/animaze/i.test(pista.label)) {
      const flujoListo = prueba;
      prueba = null;
      await usarFlujo(flujoListo, pista.label);
      return;
    }

    // Mientras "prueba" siga abierta, el navegador muestra los nombres reales de las cámaras.
    const camaras = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "videoinput");
    lista.innerHTML = "";
    camaras.forEach((c, i) => {
      const op = document.createElement("option");
      op.value = c.deviceId;
      op.textContent = c.label || "Cámara " + (i + 1);
      lista.appendChild(op);
    });

    let guardada = "";
    try { guardada = localStorage.getItem("camaraAlice") || ""; } catch (e) {}
    const elegida = camaras.find(c => /animaze/i.test(c.label)) ||
                    camaras.find(c => guardada && c.label === guardada);
    if (elegida) {
      lista.value = elegida.deviceId;
      await abrir(elegida.deviceId, elegida.label);
      return;
    }

    if (camaras.length && camaras.every(c => !c.label)) {
      avisar("El navegador no muestra los nombres de las cámaras. Recarga la página, elige la cámara de Animaze en la ventana de permiso y pulsa «Permitir mientras se visita el sitio».");
    } else {
      avisar("No encuentro la cámara virtual de Animaze. En Animaze pulsa «Habilitar cámara virtual», luego elige la cámara en la lista o pulsa «Buscar de nuevo».");
    }
  } catch (e) {
    avisar("No se pudo abrir la cámara de Animaze (" + e.name + "). Pulsa «Buscar de nuevo».");
  } finally {
    if (prueba) prueba.getTracks().forEach(t => t.stop());
  }
}

document.getElementById("mostrar").addEventListener("click", async () => {
  try { await abrir(lista.value, lista.selectedOptions[0]?.textContent); }
  catch (e) { avisar("No se pudo abrir esa cámara. Elige otra o pulsa «Buscar de nuevo»."); }
});
document.getElementById("buscar").addEventListener("click", iniciar);

function pantallaCompleta() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen();
}
document.addEventListener("dblclick", pantallaCompleta);
document.addEventListener("keydown", e => { if (e.key === "f" || e.key === "F") pantallaCompleta(); });

// Oculta el cursor cuando no se mueve el mouse.
let temporizador;
function despertar() {
  document.body.classList.remove("quieto");
  clearTimeout(temporizador);
  temporizador = setTimeout(() => document.body.classList.add("quieto"), 2000);
}
document.addEventListener("mousemove", despertar);
despertar();

iniciar();
</script>
</body>
</html>
